[package]
name = "documented-token"
version = "0.1.0"
edition = "2021"
authors = ["NEO Smart Contract RS Team"]
description = "A well-documented NEP-17 token example"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../neo-contract" }

[profile.release]
opt-level = "z"
debug = false
rpath = false
lto = true
debug-assertions = false
codegen-units = 1
panic = "abort"
incremental = false
overflow-checks = true