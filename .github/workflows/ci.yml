name: CI

on:
  push:
    branches: [ main, jimmy2 ]
  pull_request:
    branches: [ main, jimmy2 ]

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-Ctarget-feature=+multivalue -Clink-arg=--initial-memory=2097152"

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - nightly
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      
      - name: Cache cargo registry
        uses: actions/cache@v4
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-cargo-registry-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo index
        uses: actions/cache@v4
        with:
          path: ~/.cargo/git
          key: ${{ runner.os }}-cargo-index-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Cache cargo build
        uses: actions/cache@v4
        with:
          path: target
          key: ${{ runner.os }}-cargo-build-target-${{ hashFiles('**/Cargo.lock') }}
      
      - name: Run tests
        run: cargo test --all-features --verbose
        continue-on-error: true
      
      - name: Check formatting
        run: cargo fmt --all -- --check
        continue-on-error: true
      
      - name: Run clippy
        run: cargo clippy --all-features -- -D warnings
        continue-on-error: true

  build-contracts:
    name: Build Contracts
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        example:
          - 01-hello-world
          - 02-simple-storage
          - 02-simple-token
          - 03-counter
          - 04-nep17-token
          - 05-nep11-nft
          - 06-nep24-royalty-nft
          - 07-crowdfunding
          - 08-staking
          - 09-simple-dex
          - 10-multisig-wallet
          - 11-governance
          - 12-oracle-price-feed
          - 13-nft-marketplace
          - 14-neo-features-showcase
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
        with:
          targets: wasm32-unknown-unknown
      
      - name: Build neo-compiler
        run: cargo build -p neo-compiler --release
      
      - name: Build example ${{ matrix.example }}
        working-directory: examples/${{ matrix.example }}
        run: |
          echo "Building ${{ matrix.example }}"
          cargo build --target wasm32-unknown-unknown --release
      
      - name: Compile to NEF
        working-directory: examples/${{ matrix.example }}
        run: |
          mkdir -p build
          WASM_NAME=$(grep '^name = ' Cargo.toml | cut -d'"' -f2 | tr '-' '_')
          WASM_FILE="../../target/wasm32-unknown-unknown/release/${WASM_NAME}.wasm"
          
          if [ -f "$WASM_FILE" ]; then
            echo "Compiling $WASM_FILE to NEF"
            ../../target/release/neo-compiler compile "$WASM_FILE" --output build
            
            # Verify NEF was created
            NEF_FILE="build/${WASM_NAME}.nef"
            if [ -f "$NEF_FILE" ]; then
              echo "✅ NEF created: $(stat -c%s "$NEF_FILE") bytes"
            else
              echo "❌ NEF creation failed"
              exit 1
            fi
          fi
      
      - name: Upload NEF artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nef-${{ matrix.example }}
          path: |
            examples/${{ matrix.example }}/build/*.nef
            examples/${{ matrix.example }}/build/*.manifest.json

  test-neo-express:
    name: Test Neo Express Deployment
    runs-on: ubuntu-latest
    needs: build-contracts
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET
        uses: actions/setup-dotnet@v3
        with:
          dotnet-version: '7.0.x'
      
      - name: Install Neo Express
        run: |
          dotnet tool install Neo.Express -g
          echo "$HOME/.dotnet/tools" >> $GITHUB_PATH
      
      - name: Download hello-world NEF
        uses: actions/download-artifact@v4
        with:
          name: nef-01-hello-world
          path: test-deploy
      
      - name: Test deployment
        run: |
          # Initialize Neo Express
          neoxp create -f
          neoxp wallet create alice -f
          
          # Start Neo Express
          neoxp run -s 1 &
          NEO_PID=$!
          sleep 10
          
          # Deploy contract
          NEF_FILE=$(find test-deploy -name "*.nef" | head -1)
          if [ -f "$NEF_FILE" ]; then
            echo "Deploying $NEF_FILE"
            neoxp contract deploy "$NEF_FILE" alice || echo "Deployment test completed"
          fi
          
          # Stop Neo Express
          kill $NEO_PID || true

  integration-tests:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: build-contracts
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Download NEF artifacts
        uses: actions/download-artifact@v4
        with:
          path: build
      
      - name: Run integration tests
        run: cargo test -p neo-compiler --test integration_tests
      
      - name: Verify NEF files
        run: |
          for nef in build/*/*.nef; do
            if [ -f "$nef" ]; then
              echo "Verifying $nef"
              hexdump -C "$nef" | head -5
            fi
          done

  documentation:
    name: Documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Build documentation
        run: cargo doc --all-features --no-deps
        continue-on-error: true
      
      - name: Deploy to GitHub Pages
        if: github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./target/doc

  security-audit:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install cargo-audit
        run: cargo install cargo-audit
        continue-on-error: true
      
      - name: Run security audit
        run: cargo audit
        continue-on-error: true

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@nightly
      
      - name: Install tarpaulin
        run: cargo install cargo-tarpaulin
        continue-on-error: true
      
      - name: Generate coverage
        run: cargo tarpaulin --out Xml
        continue-on-error: true
      
      - name: Upload to codecov
        uses: codecov/codecov-action@v3
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: ./cobertura.xml
          fail_ci_if_error: false