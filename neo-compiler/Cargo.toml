[package]
name = "neo-compiler"
version = "1.0.0"
edition = "2021"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
hex = "0.4"
sha2 = "0.10"
wasmparser = "0.121"
wasm-encoder = "0.41"
anyhow = "1.0"
clap = { version = "4.0", features = ["derive"] }
env_logger = "0.10"
log = "0.4"

[dev-dependencies]
tempfile = "3.8"
pretty_assertions = "1.4"
wat = "1.0"

[[bin]]
name = "neo-compiler"
path = "src/main.rs"

[lib]
name = "neo_compiler"
path = "src/lib.rs"