[package]
name = "dao-example"
version = "0.1.0"
edition = "2021"
authors = ["R3E Network Team"]
description = "DAO Example for Neo N3 Smart Contracts"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../neo-contract", features = ["contract-macros"] }
neo-macros = { path = "../../neo-macros" }
hex = "0.4"

[features]
std = ["neo-contract/std"]
default = ["std"]

[profile.release]
opt-level = "z"
debug = 0
strip = "symbols"
lto = true
codegen-units = 1
panic = "abort"