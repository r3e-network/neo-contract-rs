[package]
name = "hello_with_macros"
version = "0.1.0"
edition = "2021"
authors = ["NEO Rust Team"]
description = "Hello World example using Neo Contract RS macros"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../neo-contract" }
neo-macros = { path = "../../neo-macros" }

[profile.release]
lto = true
opt-level = "z"  # Optimize for size
codegen-units = 1
panic = "abort"
strip = "symbols" 