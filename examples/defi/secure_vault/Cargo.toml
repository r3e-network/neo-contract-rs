[package]
name = "secure-vault"
version = "0.1.0"
edition = "2021"
description = "A secure token vault example for Neo N3 blockchain demonstrating advanced storage patterns and security features"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../../", default-features = false }

[features]
default = ["std"]
std = ["neo-contract/std"]

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true 