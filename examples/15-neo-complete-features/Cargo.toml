[package]
name = "neo-complete-features"
version = "1.0.0"
edition = "2021"

[dependencies]
neo-contract = { path = "../../neo-contract" }
neo-contract-proc-macros = { path = "../../neo-contract-proc-macros" }

[lib]
crate-type = ["cdylib"]

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true