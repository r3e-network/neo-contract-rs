[package]
name = "neo-macros"
version = "0.1.0"
edition = "2021"
description = "Procedural macros for Neo N3 smart contract development"
license = "MIT OR Apache-2.0"

[lib]
proc-macro = true

[dependencies]
syn = { version = "1.0", features = ["full", "extra-traits"] }
quote = "1.0"
proc-macro2 = "1.0"
