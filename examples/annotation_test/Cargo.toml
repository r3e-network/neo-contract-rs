[package]
name = "annotation_test"
version = "0.1.0"
edition = "2021"
authors = ["NEO Rust Team"]
description = "Test example for Neo contract annotations"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../neo-contract" }
neo-macros = { path = "../../neo-macros" }

[features]
default = []
std = ["neo-contract/std"]

[profile.release]
lto = true
opt-level = "s"
codegen-units = 1
panic = "abort"
strip = true 