[package]
name = "neo-contract"
version = "0.1.0"
edition = "2021"
description = "A Rust framework for Neo N3 smart contract development"
license = "MIT"
repository = "https://github.com/R3E-Network/neo-contract-rs"
documentation = "https://github.com/R3E-Network/neo-contract-rs/tree/main/docs"
readme = "../README.md"
keywords = ["neo", "blockchain", "smart-contract", "wasm", "neo3"]
categories = ["cryptography::cryptocurrencies", "wasm"]

[dependencies]
neo-macros = { path = "../neo-macros", version = "0.1.0" }
neo-macros-core = { path = "../neo-macros-core", version = "0.1.0" }
bitflags = "1.3.2"
serde = { version = "1.0", features = ["derive"] }
inventory = "0.3"

[features]
default = []
std = []
contract-macros = []
profiling = []
manifest-validation = []
