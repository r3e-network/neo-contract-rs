[package]
name = "ledger_example"
version = "0.1.0"
authors = ["Neo Contract Rust Team"]
edition = "2021"
description = "Example smart contract demonstrating Ledger API usage in Neo N3"
readme = "README.md"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
neo-contract = { path = "../../crates/neo-contract" }
hex = "0.4"

[dev-dependencies]
neo-contract-testing = { path = "../../crates/neo-contract-testing" }

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
panic = "abort"
overflow-checks = true

[profile.test]
opt-level = 0
debug = true
overflow-checks = true

[package.metadata.neo.manifest]
name = "LedgerExample"
groups = []
abi = { methods = [], events = [] }
permissions = [
    { contract = "*", methods = "*" },
]
trusts = []
extra = {
    author = "Neo Contract Rust Team",
    email = "dev@neo.org",
    description = "Example contract demonstrating Ledger API usage in Neo N3"
} 