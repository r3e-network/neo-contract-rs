name: Production Validation

on:
  push:
    branches: [ main, jimmy2 ]
  pull_request:
    branches: [ main, jimmy2 ]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  production-readiness:
    name: Production Readiness Check
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        targets: wasm32-unknown-unknown
        components: rustfmt, clippy
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      with:
        key: "production-validation"
        
    - name: Install bc for calculations
      run: sudo apt-get update && sudo apt-get install -y bc
      
    - name: Run Production Blocker Detection
      run: |
        chmod +x scripts/find-production-blockers.sh
        ./scripts/find-production-blockers.sh
      continue-on-error: false
      
    - name: Run Final Production Check
      run: |
        chmod +x scripts/final-production-check.sh
        ./scripts/final-production-check.sh
      continue-on-error: false
      
    - name: Run Neo N3 Completeness Validation
      run: |
        chmod +x scripts/validate-neo-n3-completeness.sh
        ./scripts/validate-neo-n3-completeness.sh
      continue-on-error: true
      
    - name: Run Reference Implementation Validation
      run: |
        chmod +x scripts/validate-reference-implementation.sh
        ./scripts/validate-reference-implementation.sh
      continue-on-error: true
      
    - name: Generate Production Readiness Report
      run: |
        echo "# Production Readiness Report - $(date)" > PRODUCTION_STATUS.md
        echo "" >> PRODUCTION_STATUS.md
        
        echo "## Final Production Check Results" >> PRODUCTION_STATUS.md
        echo '```' >> PRODUCTION_STATUS.md
        ./scripts/final-production-check.sh 2>&1 | tail -20 >> PRODUCTION_STATUS.md || true
        echo '```' >> PRODUCTION_STATUS.md
        echo "" >> PRODUCTION_STATUS.md
        
        echo "## Production Blockers Check" >> PRODUCTION_STATUS.md
        echo '```' >> PRODUCTION_STATUS.md
        ./scripts/find-production-blockers.sh 2>&1 | grep -E "(TODO|FIXME|placeholder|✅|❌|⚠️)" | head -20 >> PRODUCTION_STATUS.md || true
        echo '```' >> PRODUCTION_STATUS.md
        
    - name: Upload production reports
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: production-readiness-reports
        path: |
          PRODUCTION_STATUS.md
          VALIDATION_SUMMARY.md
        retention-days: 30

  core-build:
    name: Core Framework Build
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        targets: wasm32-unknown-unknown
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Build neo-contract
      run: cargo build -p neo-contract --release
      
    - name: Build neo-compiler
      run: cargo build -p neo-compiler --release
      
    - name: Build neo-contract-proc-macros
      run: cargo build -p neo-contract-proc-macros --release
      
    - name: Test core library
      run: cargo test -p neo-contract --lib

  example-validation:
    name: Example Contracts Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        example:
          - "01-hello-world"
          - "01-hello-world-solana-style"
          - "02-simple-storage"
          - "02-simple-token"
          - "03-counter"
          - "04-nep17-token"
          - "05-nep11-nft"
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        targets: wasm32-unknown-unknown
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Build core framework
      run: |
        cargo build -p neo-contract --release
        cargo build -p neo-compiler --release
        
    - name: Build example
      working-directory: examples/${{ matrix.example }}
      run: |
        echo "Building ${{ matrix.example }}..."
        cargo check
        
    - name: Build WASM for example
      working-directory: examples/${{ matrix.example }}
      env:
        RUSTFLAGS: "-Ctarget-feature=+multivalue -Clink-arg=--initial-memory=2097152"
      run: |
        echo "Building ${{ matrix.example }} to WASM..."
        cargo build --target wasm32-unknown-unknown --release
      continue-on-error: true
        
    - name: Check WASM output
      run: |
        find target -name "*.wasm" -path "*/examples/${{ matrix.example }}/*" | head -5
        echo "WASM build completed for ${{ matrix.example }}"

  security-validation:
    name: Security Validation
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@stable
      with:
        components: clippy, rustfmt
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Install cargo-audit
      run: cargo install cargo-audit --locked
      
    - name: Install cargo-deny
      run: cargo install cargo-deny --locked
      
    - name: Run dependency security audit
      run: cargo audit
      
    - name: Run license and dependency check
      run: cargo deny check --log-level warn
      
    - name: Run security-focused Clippy lints
      run: |
        cargo clippy --all-targets --all-features -- \
          -D clippy::unwrap_used \
          -D clippy::expect_used \
          -D clippy::panic \
          -D clippy::unimplemented \
          -W clippy::suspicious \
          -W clippy::complexity
      continue-on-error: true
      
    - name: Check for unsafe code in production paths
      run: |
        echo "Checking for unsafe code in production modules..."
        find neo-contract/src neo-compiler/src neo-contract-proc-macros/src -name "*.rs" -exec grep -Hn "unsafe" {} \; || echo "No unsafe code found"

  comprehensive-test:
    name: Comprehensive Test Suite
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Install Rust
      uses: dtolnay/rust-toolchain@master
      with:
        toolchain: nightly
        components: llvm-tools-preview
        
    - name: Cache dependencies
      uses: Swatinem/rust-cache@v2
      
    - name: Install cargo-llvm-cov
      run: cargo install cargo-llvm-cov --locked
      
    - name: Run tests with coverage
      run: |
        cargo llvm-cov --workspace --lcov --output-path lcov.info \
          --ignore-filename-regex "(tests|examples)" \
          --exclude-from-test
      continue-on-error: true
      
    - name: Run comprehensive validation suite
      run: |
        chmod +x scripts/run-all-validations.sh
        ./scripts/run-all-validations.sh
      continue-on-error: true
      
    - name: Upload test artifacts
      uses: actions/upload-artifact@v4
      if: always()
      with:
        name: test-results
        path: |
          lcov.info
          VALIDATION_SUMMARY.md
        retention-days: 30

  validation-summary:
    name: Validation Summary
    runs-on: ubuntu-latest
    needs: [production-readiness, core-build, example-validation, security-validation, comprehensive-test]
    if: always()
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      
    - name: Generate CI Summary
      run: |
        echo "# Neo N3 Framework CI Validation Summary" > CI_SUMMARY.md
        echo "**Date**: $(date)" >> CI_SUMMARY.md
        echo "" >> CI_SUMMARY.md
        
        echo "## Job Results" >> CI_SUMMARY.md
        echo "| Job | Status | Result |" >> CI_SUMMARY.md
        echo "|-----|--------|--------|" >> CI_SUMMARY.md
        echo "| Production Readiness | ${{ needs.production-readiness.result }} | Core framework validation |" >> CI_SUMMARY.md
        echo "| Core Build | ${{ needs.core-build.result }} | Framework compilation |" >> CI_SUMMARY.md
        echo "| Example Validation | ${{ needs.example-validation.result }} | Contract examples |" >> CI_SUMMARY.md
        echo "| Security Validation | ${{ needs.security-validation.result }} | Security and audit checks |" >> CI_SUMMARY.md
        echo "| Comprehensive Test | ${{ needs.comprehensive-test.result }} | Full test suite |" >> CI_SUMMARY.md
        echo "" >> CI_SUMMARY.md
        
        if [ "${{ needs.production-readiness.result }}" == "success" ]; then
          echo "### ✅ Production Readiness: PASSED" >> CI_SUMMARY.md
          echo "The Neo N3 framework meets enterprise production standards." >> CI_SUMMARY.md
        else
          echo "### ❌ Production Readiness: FAILED" >> CI_SUMMARY.md
          echo "The framework requires improvements before production deployment." >> CI_SUMMARY.md
        fi
        echo "" >> CI_SUMMARY.md
        
        if [ "${{ needs.core-build.result }}" == "success" ]; then
          echo "### ✅ Core Framework: BUILDS SUCCESSFULLY" >> CI_SUMMARY.md
          echo "All core components compile without errors." >> CI_SUMMARY.md
        else
          echo "### ❌ Core Framework: BUILD ISSUES" >> CI_SUMMARY.md
          echo "Core framework has compilation problems." >> CI_SUMMARY.md
        fi
        echo "" >> CI_SUMMARY.md
        
        echo "### 📋 Next Steps" >> CI_SUMMARY.md
        if [ "${{ needs.production-readiness.result }}" == "success" ] && [ "${{ needs.core-build.result }}" == "success" ]; then
          echo "- Framework is ready for production deployment" >> CI_SUMMARY.md
          echo "- Consider performance optimization" >> CI_SUMMARY.md
          echo "- Monitor any remaining minor issues" >> CI_SUMMARY.md
        else
          echo "- Address compilation errors in core framework" >> CI_SUMMARY.md
          echo "- Fix production readiness blockers" >> CI_SUMMARY.md
          echo "- Re-run validation after fixes" >> CI_SUMMARY.md
        fi
        
        echo "" >> CI_SUMMARY.md
        echo "---" >> CI_SUMMARY.md
        echo "*Generated by Neo N3 Framework CI Pipeline*" >> CI_SUMMARY.md
        
    - name: Comment PR with summary
      if: github.event_name == 'pull_request'
      uses: actions/github-script@v7
      with:
        script: |
          const fs = require('fs');
          if (fs.existsSync('CI_SUMMARY.md')) {
            const summary = fs.readFileSync('CI_SUMMARY.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: summary
            });
          }
          
    - name: Upload CI summary
      uses: actions/upload-artifact@v4
      with:
        name: ci-summary
        path: CI_SUMMARY.md
        retention-days: 30