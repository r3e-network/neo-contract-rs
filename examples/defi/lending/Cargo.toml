[package]
name = "neo-lending"
version = "0.1.0"
edition = "2021"
authors = ["Neo Smart Contract Authors"]
description = "NEO N3 Lending Protocol Smart Contract Example"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../../neo-contract" }

[profile.release]
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true
overflow-checks = true