[package]
name = "token_with_annotations"
version = "0.1.0"
edition = "2021"
authors = ["NEO Rust Team"]
description = "NEP-17 Token example using Neo Contract RS annotations"
license = "MIT"

[lib]
crate-type = ["cdylib"]

[dependencies]
neo-contract = { path = "../../neo-contract" }

[profile.release]
lto = true
opt-level = "z"  # Optimize for size
codegen-units = 1
panic = "abort"
strip = "symbols" 